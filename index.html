<!doctype html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VWC — VWC naar LaTeX</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' fill='%23fff' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='14'%3EVWC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div id="loader" class="loader">
  <div class="loader-spinner"></div>
</div>

<main class="app">
  <header class="header">
    <div class="header-left">
      <h1 class="logo">VWC</h1>
    </div>
    <div class="header-right">
      <button id="theme-btn" class="theme-btn" aria-label="Toggle theme">
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <section class="panel panel-input">
      <div class="panel-head">
        <span class="panel-label">VWC invoer</span>
        <div class="panel-actions">
          <button id="paste-btn" class="action-btn" title="Plakken" aria-label="Plakken">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11v6"/><path d="M9 14l3 3 3-3"/></svg>
          </button>
          <button id="copy-input-btn" class="action-btn" title="Kopiëren" aria-label="Kopiëren">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button id="clear-btn" class="action-btn" title="Wissen" aria-label="Wissen">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
      </div>
      <textarea id="input" class="input" placeholder="Typ je VWC code..." spellcheck="false"></textarea>
    </section>

    <section class="panel panel-output" id="output-panel">
      <div class="panel-head">
        <span class="panel-label">LaTeX resultaat</span>
      </div>
      <div class="output-body">
        <div class="preview" id="preview">
          <span class="empty-state">Je wiskunde verschijnt hier</span>
        </div>
        <div class="code-wrap">
          <pre class="code" id="code"><span class="code-placeholder">// LaTeX code</span></pre>
          <button class="copy-btn" id="copy-btn" aria-label="Copy LaTeX">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
      </div>
      <div id="error-bar" class="error-bar" hidden>
        <div class="error-icon">!</div>
        <div class="error-body">
          <span class="error-msg" id="error-msg"></span>
          <span class="error-ctx" id="error-ctx"></span>
        </div>
        <button class="error-close" id="error-close">&times;</button>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="static/js/wasm-loader.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>

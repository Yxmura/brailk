services:
  - type: web
    runtime: python
    name: brailk
    repo: https://github.com/Yxmura/brailk
    numInstances: 1
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install flask requests typst
    startCommand: python app.py
    autoDeployTrigger: commit
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"

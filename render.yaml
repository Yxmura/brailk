services:
  - type: web
    runtime: python
    name: brailk
    repo: https://github.com/Yxmura/brailk
    numInstances: 1
    region: frankfurt
    plan: free
    branch: master
    buildCommand: pip install flask requests typst gunicorn
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class sync --workers 1 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
